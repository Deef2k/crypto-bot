basePath: /
definitions:
  models.RateResponse:
    properties:
      highPrice:
        type: string
      lowPrice:
        type: string
      price:
        type: string
      priceChangePercent:
        type: string
      symbol:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Deef2k
    url: https://github.com/Deef2k
  description: |-
    API для получения курсов криптовалют с Binance

    Этот API предоставляет доступ к актуальным курсам криптовалют.
    Данные обновляются каждые 5 минут.
  title: Crypto Bot API
  version: "1.0"
paths:
  /api/rates:
    get:
      consumes:
      - application/json
      description: Возвращает массив актуальных курсов всех криптовалют
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.RateResponse'
            type: array
        "500":
          description: Ошибка сервера
          schema:
            type: string
      summary: Получить все курсы валют
      tags:
      - rates
  /api/rates/{symbol}:
    get:
      consumes:
      - application/json
      description: Возвращает актуальный курс криптовалюты по символу (например, BTCUSDT)
      parameters:
      - description: Символ валютной пары
        example: BTCUSDT
        in: path
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RateResponse'
        "400":
          description: Неверный запрос
          schema:
            type: string
        "502":
          description: Проблема со сторонним провайдером
          schema:
            type: string
      summary: Получить курс конкретной валюты
      tags:
      - rates
swagger: "2.0"
