name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - run: go mod download
      - run: go vet ./...
      - run: go test ./... -v -count=1
      - run: go build -v -o crypto-bot .

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crypto-bot:ci .